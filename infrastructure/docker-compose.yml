services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rootcause_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: rootcause
      POSTGRES_PASSWORD: rootcause_dev_password
      POSTGRES_DB: rootcause
    ports:
      - "5439:5432"
    volumes:
      - rootcause_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootcause -d rootcause"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: rootcause_redis
    restart: unless-stopped
    ports:
      - "6384:6379"
    volumes:
      - rootcause_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rootcause_pg_data:
  rootcause_redis_data:
